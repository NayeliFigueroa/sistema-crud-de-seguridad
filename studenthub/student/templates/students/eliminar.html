{% extends "students/base.html" %}
{% block content %}
<h1>Eliminar</h1>
<p>¿Seguro que deseas eliminar a <strong>{{ estudiante.nombre }}</strong>?</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger">Sí, eliminar</button>
  <a class="btn btn-secondary" href="{% url 'student:listar' %}">Cancelar</a>
</form>
{% endblock %}
