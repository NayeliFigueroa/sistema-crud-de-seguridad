{% extends "students/base.html" %}
{% block content %}
<h1>Editar: {{ estudiante.nombre }}</h1>
<form method="post" class="card card-body">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary">Actualizar</button>
  <a class="btn btn-secondary" href="{% url 'student:listar' %}">Volver</a>
</form>
{% endblock %}
